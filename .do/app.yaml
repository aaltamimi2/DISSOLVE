# DigitalOcean App Platform: the hosted web app (see the Dockerfile). Every push to the branch rebuilds and redeploys.
# Secret values are never in this file; they are set on the app and kept encrypted there. Accounts and chats live in
# the attached dev database (db), which a redeploy leaves alone; DISSOLVE_WEB_PASSWORD is the sign-up access code.
name: dissolve
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: aaltamimi2/DISSOLVE
      branch: main-cleanup-frontend
      deploy_on_push: true
    http_port: 8080
    instance_size_slug: basic-s
    instance_count: 1
    health_check:
      http_path: /api/health
    envs:
      - key: OPENROUTER_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: DISSOLVE_WEB_PASSWORD
        type: SECRET
        scope: RUN_TIME
      # Short sign-up codes beside DISSOLVE_WEB_PASSWORD, comma-separated, for people typing one from a slide.
      - key: DISSOLVE_SIGNUP_CODES
        type: SECRET
        scope: RUN_TIME
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # Literature search runs the RAG-90 engine packaged in data/rag90 (rag90_search.py); without it, the hybrid search.
      - key: DISSOLVE_LITERATURE_ENGINE
        scope: RUN_TIME
        value: rag90
      # The waste-pathway and tornado tools on the site: at most two live simulations per request (the site runs one at a
      # time for everyone, about a minute each), and no figure files. A local install has neither limit.
      - key: DISSOLVE_PATHWAY_MAX_LIVE_RUNS
        scope: RUN_TIME
        value: "2"
      - key: DISSOLVE_PATHWAY_FIGURES
        scope: RUN_TIME
        value: "off"
      - key: DISSOLVE_NO_OPEN
        scope: RUN_TIME
        value: "1"
      # The read-only admin view (web_admin.py); the owner's copy is in ~/.config/dissolve/admin_token (mode 600).
      - key: DISSOLVE_ADMIN_TOKEN
        type: SECRET
        scope: RUN_TIME
      # Live TEA's plastics model is fetched at build time from the owner's private repository aaltamimi2/plastics-core
      # (deploy/fetch_plastics.py), with a read-only token for that repository alone. Only the build's first stage
      # sees it; the running app never does.
      - key: PLASTICS_TOKEN
        type: SECRET
        scope: BUILD_TIME
databases:
  - name: db
    engine: PG
    production: false
