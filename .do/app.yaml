# DigitalOcean App Platform: the hosted web app (see the Dockerfile). Every push to the branch rebuilds and redeploys.
# Secret values are never in this file; they are set on the app and kept encrypted there. Accounts and chats live in
# the attached dev database (db), which a redeploy leaves alone; DISSOLVE_WEB_PASSWORD is the sign-up access code.
name: dissolve
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: aaltamimi2/DISSOLVE
      branch: main-cleanup-frontend
      deploy_on_push: true
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    instance_count: 1
    health_check:
      http_path: /api/health
    envs:
      - key: OPENROUTER_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: DISSOLVE_WEB_PASSWORD
        type: SECRET
        scope: RUN_TIME
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
databases:
  - name: db
    engine: PG
    production: false
