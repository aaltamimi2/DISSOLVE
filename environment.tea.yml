# Exact pins are required because the admitted TEA cache was generated with
# BioSTEAM 2.52.17 and Thermosteam 0.52.16. Live results from a different
# simulation stack are not comparable to those cached records. Biorefineries
# 2.34.10 is the resolver-compatible release for that governed stack.
name: dissolve-tea-312
channels:
  - conda-forge
dependencies:
  - python=3.12.13
  - pip
  - pip:
      - biosteam==2.52.17
      - thermosteam==0.52.16
      - biorefineries==2.34.10
