[tool.uv.sources]
# torch as the corpus was built: the CUDA 12.8 build on Linux, so Docling parses on the GPU when there is one (the BGE
# encoder is pinned to CPU either way). macOS takes PyPI's build.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
