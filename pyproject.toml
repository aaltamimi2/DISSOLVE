[project]
name = "dissolve"
version = "0.1"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "openai>=1",
    "anthropic>=0.40",
    "google-genai>=1",
    "rich>=13",
    "prompt_toolkit>=3.0",
    "langchain-core>=1.0",
    "numpy>=2",
    "scipy>=1.11",
    "joblib>=1.3",
    # The HSP random forest in data/ was pickled with scikit-learn 1.8.0.
    "scikit-learn>=1.8,<1.9",
    "rdkit>=2023.9",
    "pyomo>=6.7",
]

[project.optional-dependencies]
# PDF parsing, chunking, embedding and reranking exactly as the served corpus was built.
literature = [
    "docling==2.121.0",
    "sentence-transformers==5.2.0",
    "pypdf>=5",
    "langchain>=1.0",
]

[project.scripts]
dissolve = "dissolve.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dissolve = ["data/*", "data/corpus/*", "data/campaign/*", "cosmo_workers/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
