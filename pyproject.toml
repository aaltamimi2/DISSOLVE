[project]
name = "dissolve"
version = "0.1"
requires-python = ">=3.11,<3.12"  # the validated interpreter line; ./dissolve fetches it if missing
dependencies = [
    "duckdb>=1.0",
    "openai>=1",
    "anthropic>=0.40",
    "google-genai>=1",
    "rich>=13",
    "prompt_toolkit>=3.0",
    "langchain-core>=1.0",
    "numpy>=2",
    "scipy>=1.11",
    "joblib>=1.3",
    # The HSP random forest in data/ was pickled with scikit-learn 1.8.0.
    "scikit-learn>=1.8,<1.9",
    "rdkit>=2023.9",
    "pyomo>=6.7",
    # Literature: PDF parsing, chunking, embedding and reranking exactly as the served corpus was built, and the
    # typed extraction model.
    "docling==2.121.0",
    "sentence-transformers==5.2.0",
    "transformers==4.57.6",
    "torch>=2.4",
    "huggingface-hub>=0.30",
    "pypdf>=5",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    # dissolve web: the API over the agent and the built UI in src/dissolve/ui (source in web/).
    "fastapi>=0.109",
    "uvicorn>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
dissolve = "dissolve.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dissolve = ["data/*", "data/corpus/*", "data/campaign/*", "cosmo_workers/*.py", "ui/*", "ui/assets/*"]

[tool.uv]
# Bash launcher: Linux and macOS (Windows through WSL).
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
# The lock reproduces the environment the suite was validated in, package for package.
