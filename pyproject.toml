[project]
name = "dissolve-v12"
version = "0.1"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "openai>=1",
    "anthropic>=0.40",
    "google-genai>=1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dissolve = ["data/*.duckdb"]
